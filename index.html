<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050b1f">
  <title>Prediction Lab</title>
  <link rel="icon" href="data:,"><!-- no favicon file: stops the browser requesting /favicon.ico (a 404 on every load) -->
  <meta name="description" content="A self-paced prediction lab mission.">
  <link rel="preload" href="assets/images/ui/logo_autocomplete_trap.webp" as="image">
  <link rel="preload" href="assets/images/characters/krish/char_krish_point.webp" as="image">
  <link rel="preload" href="assets/images/characters/blip/spr_blip_idle.webp" as="image">
  <link rel="preload" href="assets/images/characters/byte/spr_byte_idle.webp" as="image">
  <link rel="preload" href="assets/images/characters/dot/spr_dot_idle.webp" as="image">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/skai-theme.css">
  <link rel="stylesheet" href="css/accessibility.css">
</head>
<body>
<div id="app" class="app">
  <div class="backdrop" aria-hidden="true"><div class="backdrop__img" id="backdrop"></div></div>

  <main id="arena" class="arena" aria-label="Prediction laboratory">
    <div id="world" class="world">
      <div class="bg" aria-hidden="true">
        <div class="bg__layer" id="bgA"></div>
        <div class="bg__layer" id="bgB"></div>
        <div class="bg__vignette"></div>
      </div>
      <div class="dialogue-scrim" aria-hidden="true"></div>
      <canvas id="fx" class="fx-canvas" width="960" height="540" aria-hidden="true"></canvas>

      <!-- TITLE -->
      <section class="scene scene--title" data-scene="title" aria-label="Title">
        <div class="title__ambience" aria-hidden="true">
          <i class="title__orbit title__orbit--outer"></i>
          <i class="title__orbit title__orbit--inner"></i>
          <i class="title__scan"></i>
        </div>
        <div class="title-cast" aria-hidden="true">
          <div class="title-cast__member title-cast__member--blip">
            <span class="title-cast__shadow"></span>
            <img src="assets/images/characters/blip/spr_blip_idle.webp" alt="" draggable="false">
          </div>
          <div class="title-cast__member title-cast__member--byte">
            <span class="title-cast__shadow"></span>
            <img src="assets/images/characters/byte/spr_byte_idle.webp" alt="" draggable="false">
          </div>
          <div class="title-cast__member title-cast__member--dot">
            <span class="title-cast__shadow"></span>
            <img src="assets/images/characters/dot/spr_dot_idle.webp" alt="" draggable="false">
          </div>
          <div class="title-cast__member title-cast__member--krish">
            <span class="title-cast__shadow"></span>
            <img src="assets/images/characters/krish/char_krish_point.webp" alt="" draggable="false">
          </div>
        </div>
        <div class="title">
          <div class="title__halo" aria-hidden="true"></div>
          <h1 class="title__name" id="titleName"></h1>
          <div class="loader" id="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="loader__track"><div class="loader__well"><i class="loader__fill" id="loaderFill"></i></div></div>
            <div class="loader__meta" aria-hidden="true"><span>Loading</span><span id="loaderPct">0%</span></div>
          </div>
          <button type="button" class="btn btn--primary btn--xl" id="startBtn" hidden disabled>
            <span class="title__play" aria-hidden="true"><i></i></span>
            <span class="btn__label"><strong>Start Mission</strong></span>
          </button>
        </div>
      </section>

      <!-- MAIN LAB: intro, phone, boot, prediction run, cause guess, memory dive, retest -->
      <section class="scene scene--lab" data-scene="lab" aria-label="Prediction lab">
        <svg class="conduits" id="conduits" viewBox="0 0 1920 1080" aria-hidden="true">
          <path d="M 470 560 C 620 640, 700 690, 840 720" />
          <path d="M 1500 560 C 1360 640, 1260 690, 1110 720" />
          <path d="M 60 700 C 240 690, 420 700, 520 760" />
          <path d="M 1880 700 C 1700 690, 1520 700, 1420 760" />
          <path d="M 960 1080 L 960 900" />
          <path d="M 335 180 C 335 120, 330 80, 320 0" />
        </svg>
        <div class="pod" id="pod">
          <div class="pod__glow" aria-hidden="true"></div>
          <div class="pod__blip" id="blipPod"></div>
          <div class="pod__scan" aria-hidden="true"><i></i><i></i><i></i></div>
          <button type="button" class="pod__orb" id="podOrb" aria-label="Wake Blip" disabled><span class="pod__orb-core"></span></button>
        </div>
        <svg class="beams" id="labBeams" viewBox="0 0 1920 1080" aria-hidden="true"></svg>

        <!-- Opening: a phone keyboard shows what autocomplete is. -->
        <div class="phone" id="phone" hidden>
          <div class="phone__body">
            <span class="phone__notch" aria-hidden="true"></span>
            <div class="phone__chat">
              <p class="phone__bubble" id="phoneBubble"><span id="phoneTyped"></span><span class="phone__caret" aria-hidden="true"></span></p>
            </div>
            <div class="phone__suggest" id="phoneSuggest" role="group" aria-label="Suggested words"></div>
            <div class="phone__keys" id="phoneKeys" role="group" aria-label="Keyboard"></div>
          </div>
        </div>
        <div class="question question--phone" id="phoneQ">
          <p class="question__prompt" id="phonePrompt"></p>
          <p class="question__note">Any guess is okay.</p>
          <div class="options options--stack options--phone" id="phoneOptions" role="group"></div>
          <div class="cta-dock" id="phoneCta"></div>
        </div>

        <div class="console" id="console">
          <div class="phrase phrase--blip" id="labPhrase"></div>
          <p class="prediction-instruction" id="predictionInstruction" hidden>
            <strong id="predictionPrompt">Which word do you think Blip will choose?</strong>
            <span id="predictionNote">Any prediction is okay.</span>
          </p>
          <div class="choices" id="choices" role="group" aria-label="Your prediction" aria-describedby="predictionInstruction"></div>
          <div class="pathways" id="pathways" aria-hidden="true"></div>
          <div class="suggest-row" id="suggestRow"></div>
          <div class="cta-dock" id="labCta"></div>
          <ol class="tray" id="tray" aria-label="Blip's answers so far"></ol>
        </div>

        <div class="evidence" id="evidence">
          <div class="evidence__rows" id="evidenceRows" role="list" aria-label="What Blip said"></div>
        </div>
        <div class="question" id="causeQ">
          <p class="question__prompt" id="causePrompt"></p>
          <p class="question__note" id="causeNote">Any guess is okay.</p>
          <div class="options options--row" id="causeOptions" role="group"></div>
          <div class="cta-dock" id="causeCta"></div>
        </div>
      </section>

      <!-- BYTE VAULT -->
      <section class="scene scene--vault" data-scene="vault" aria-label="Data vault">
        <div class="mini-blip" id="miniBlip">
          <div class="mini-blip__sprite" id="blipMini"></div>
          <div class="tiny-memory" id="tinyMemory" aria-label="Blip's tiny memory"></div>
        </div>
        <div class="base" id="byteBase" aria-hidden="true">
          <span class="base__label">Byte’s memory</span>
          <div class="base__stack" id="baseStack"></div>
          <div class="base__streams"><i></i><i></i><i></i><i></i></div>
          <div class="base__frame base__frame--l"></div><div class="base__frame base__frame--r"></div>
        </div>
        <div class="byte-mount" id="byteMount"></div>
        <svg class="beams" id="vaultBeams" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
        <div class="byte-console" id="byteConsole">
          <div class="phrase phrase--byte" id="bytePhrase"></div>
          <p class="prediction-instruction byte-ask" id="byteAsk" hidden><strong id="byteAskPrompt">What will Byte say?</strong><span id="byteAskNote">Any guess is okay.</span></p>
          <div class="choices choices--byte" id="byteChoices" role="group" aria-describedby="byteAsk"></div>
          <div class="cta-dock" id="byteCta"></div>
        </div>
      </section>

      <!-- INSIDE BLIP'S MEMORY -->
      <section class="scene scene--memory" data-scene="memory" aria-label="Blip's memory">
        <div class="bank" id="bank">
          <div class="bank__strips" id="strips" role="group" aria-label="Blip's memory sentences"></div>
        </div>
        <svg class="beams" id="memoryBeams" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
        <div class="said" id="said" role="group" aria-label="What Blip said in the tests"><p class="said__head" aria-hidden="true">Blip said</p><div class="said__list" id="saidList"></div></div>
        <div class="guess-card" id="guessCard" hidden><span class="guess-card__head">Your idea</span><span class="guess-card__text" id="guessText"></span><strong class="guess-card__result" id="guessResult"></strong></div>
        <div class="cta-dock cta-dock--memory" id="memoryCta"></div>
      </section>

      <!-- REPAIR BAY -->
      <section class="scene scene--repair" data-scene="repair" aria-label="Repair bay">
        <div class="target" id="repairTarget">
          <div class="phrase phrase--target" id="repairPhrase"></div>
          <div class="target__arrow" aria-hidden="true"></div>
          <div class="target__want" id="repairWant"></div>
        </div>
        <div class="repair-blip" id="repairBlip"></div>
        <div class="rack" id="rack">
          <div class="rack__head" aria-hidden="true"><span class="rack__lid rack__lid--l"></span><span class="rack__lid rack__lid--r"></span></div>
          <div class="rack__tokens" id="rackTokens" aria-hidden="true"></div>
          <ul class="rack__strips" id="rackStrips" aria-label="Blip's memory"></ul>
        </div>
        <div class="dock-port" id="dockPort" aria-hidden="true"><span></span></div>
        <svg class="beams" id="repairBeams" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
        <div class="cartridges" id="cartridges" role="group"></div>
        <div class="cta-dock cta-dock--repair" id="repairCta"></div>
      </section>

      <!-- RULE FORGE -->
      <section class="scene scene--logic" data-scene="logic" aria-label="Comparison chamber">
        <div class="side side--blip" id="ruleBlipSide">
          <div class="side__sprite" id="ruleBlip"></div>
          <div class="tiny-memory tiny-memory--rule" id="ruleTiny"></div>
          <div class="side__evidence" id="ruleBlipEvidence"></div>
        </div>
        <div class="side side--byte" id="ruleByteSide">
          <div class="base base--mini" id="ruleBase" aria-hidden="true">
            <span class="base__label">Byte’s memory</span>
            <div class="base__stack"></div>
            <div class="base__streams"><i></i><i></i><i></i></div>
          </div>
          <div class="side__sprite side__sprite--byte" id="ruleByte"></div>
          <div class="side__evidence" id="ruleByteEvidence"></div>
        </div>
        <svg class="beams" id="ruleBeams" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
        <div class="socket" id="socket" aria-hidden="true"><img data-src="assets/images/props/prop_logic_core.webp" alt=""><span class="socket__slot" id="socketSlot"></span></div>
        <div class="question question--rule" id="ruleQ">
          <p class="question__prompt" id="rulePrompt"></p>
          <div class="options options--stack" id="ruleOptions" role="group"></div>
        </div>
        <div class="cta-dock cta-dock--rule" id="ruleCta"></div>
      </section>

      <!-- DOT -->
      <section class="scene scene--dot" data-scene="dot" aria-label="Dot's system">
        <div class="dot-mount" id="dotMount"></div>
        <div class="dot-memory" id="dotMemory">
          <div class="dot-memory__strips" id="dotStrips" aria-label="Dot's memory"></div>
          <div class="seek" id="seek" aria-hidden="true"><span class="seek__lens"></span><span class="seek__word" id="seekWord"></span><span class="seek__result" id="seekResult"></span></div>
        </div>
        <div class="question question--dot" id="dotQ">
          <p class="question__lead" id="dotLead"></p>
          <p class="question__phrase" id="dotPhrase"></p>
          <div class="options options--yesno" id="dotOptions" role="group"></div>
          <div class="dot-pips" id="dotPips" aria-hidden="true"></div>
        </div>
        <div class="dot-review" id="dotReview" role="list" aria-label="Evidence check"></div>
        <div class="cta-dock cta-dock--dot" id="dotCta"></div>
      </section>

      <!-- COMPLETE -->
      <section class="scene scene--complete" data-scene="complete" aria-label="Mission complete">
        <div class="finale">
          <h2 class="finale__headline" id="finaleHeadline"></h2>
          <div class="finale__body">
            <div class="recap" id="recap" role="region" aria-label="Mission recap" hidden></div>
            <div class="cta-dock cta-dock--finale" id="finaleCta"></div>
          </div>
        </div>
        <div class="cast cast--blip" id="castBlip"></div>
        <div class="cast cast--dot" id="castDot"></div>
        <div class="cast cast--byte" id="castByte"></div>
      </section>

      <!-- Action instruction: stays on screen while an action is live (dialogue is separate). -->
      <p class="task" id="task" role="status" aria-live="polite" hidden>
        <svg class="task__icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 15V7.5a2 2 0 0 1 4 0V14"/><path d="M16 13.5a2 2 0 0 1 4 0V15a2 2 0 0 1 4 0v4.5A7.5 7.5 0 0 1 16.5 27h-1a7 7 0 0 1-5.6-2.8L6.5 19.6a2 2 0 0 1 3-2.6L12 19"/></svg>
        <span class="task__text" id="taskText"></span>
      </p>
    </div>

    <div id="krish"></div>

    <!-- Stakes story — generated environments with the exact approved Blip art layered on top. -->
    <div class="stakes-story" id="storySequence" aria-hidden="true" hidden>
      <div class="stakes-story__scrim"></div>
      <div class="stakes-story__frame">
        <div class="stakes-story__viewport">
          <div class="stakes-story__scene" data-story-key="stakes-school">
            <img class="stakes-story__backdrop" data-src="assets/images/backgrounds/story_school_launch.webp" alt="" draggable="false">
            <img class="stakes-story__character stakes-story__character--school" data-src="assets/images/characters/blip/spr_blip_idle.webp" alt="" draggable="false">
          </div>
          <div class="stakes-story__scene" data-story-key="stakes-strange">
            <img class="stakes-story__backdrop" data-src="assets/images/backgrounds/story_strange_suggestions.webp" alt="" draggable="false">
            <img class="stakes-story__character stakes-story__character--strange" data-src="assets/images/characters/blip/spr_blip_awkward.webp" alt="" draggable="false">
          </div>
          <div class="stakes-story__scene" data-story-key="stakes-night">
            <img class="stakes-story__backdrop" data-src="assets/images/backgrounds/story_power_down.webp" alt="" draggable="false">
            <img class="stakes-story__character stakes-story__character--night" data-src="assets/images/characters/blip/spr_blip_awkward.webp" alt="" draggable="false">
          </div>
          <div class="stakes-story__scene" data-story-key="finale-phone">
            <img class="stakes-story__backdrop" data-src="assets/images/backgrounds/story_finale_phone.webp" alt="" draggable="false">
            <img class="stakes-story__character stakes-story__character--phone" data-src="assets/images/characters/blip/spr_blip_idle.webp" alt="" draggable="false">
          </div>
          <div class="stakes-story__scene" data-story-key="finale-team">
            <img class="stakes-story__backdrop" data-src="assets/images/backgrounds/story_finale_team.webp" alt="" draggable="false">
            <img class="stakes-story__character stakes-story__character--guide" data-src="assets/images/characters/krish/char_krish_happy.webp" alt="" draggable="false">
          </div>
          <div class="stakes-story__shade"></div>
          <div class="stakes-story__pips" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <!-- HUD (after title only) — SKAI HUD pattern -->
    <div class="hud" id="hud" hidden>
      <div class="hud__corner">
